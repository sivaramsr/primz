<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Categories - Prizm Lights</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="staff.css">
</head>
<body>
    <div class="staff-container">
        <header class="staff-header">
            <div>
                <h1>Categories</h1>
                <nav class="staff-nav">
                    <a href="staff-dashboard.html">Dashboard</a>
                    <a href="staff-categories.html" class="active">Categories</a>
                </nav>
            </div>
            <div>
                <button onclick="openCategoryModal()" class="btn-primary" style="margin-right: 1rem;">+ Add Category</button>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </header>

        <div style="margin-bottom: 2rem;">
            <p style="color: #6B6B67; font-size: 1.1rem;">Select a category to manage its products.</p>
        </div>

        <div class="grid-4" id="categoriesGrid">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="width: 100%; max-width: 500px; margin: 2rem; background: var(--background);">
            <h2 id="categoryModalTitle" style="margin-bottom: 1.5rem; font-family: 'Cormorant Garamond', serif;">Add Category</h2>
            <form id="categoryForm" onsubmit="saveCategory(event)">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label for="categoryName">Category Name</label>
                    <input type="text" id="categoryName" class="form-control" required placeholder="e.g. Table Lamps">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-secondary" onclick="closeCategoryModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="categorySubmitBtn">Create Category</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>
    <script src="staff.js?v=4"></script>
    <script>
        checkAuth();
        loadCategoriesPage();
    </script>
</body>
</html>
