<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      padding: 3rem;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .preview-box {
      border: 1px solid #333;
      padding: 2rem;
      border-radius: 8px;
    }
    .preview-box.light {
      background-color: #FBF9F4;
      color: #1F1F1F;
    }
    .logo-wordmark-svg {
      height: 40px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="preview-box">
      <h3>Dark Background (Loader/Footer)</h3>
      <svg class="logo-wordmark-svg" viewBox="0 0 340 50" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- PRIZM -->
        <g stroke="currentColor" stroke-width="4.5">
          <!-- P -->
          <path d="M12,5 V45 M12,5 L34,17 L12,27" />
          <!-- R -->
          <path d="M46,5 V45 M46,5 L68,17 L46,27 M56,27 L68,45" />
          <!-- I -->
          <path d="M80,5 V45" />
          <!-- M -->
          <path d="M130,45 V5 L146,24 L162,5 V45" />
        </g>
        
        <!-- Z (Gold) -->
        <path d="M92,5 H116 L92,45 H116" stroke="#FFC107" stroke-width="4.5" />
        
        <!-- LIGHTS -->
        <g>
          <!-- L (Gold with underline) -->
          <path d="M178,5 V42 H222" stroke="#FFC107" stroke-width="4.5" />
          <!-- i (White with dot) -->
          <path d="M192,18 V42" stroke="currentColor" stroke-width="4.5" />
          <rect x="189.75" y="6" width="4.5" height="4.5" fill="currentColor" />
          <!-- G, H, T, S (White) -->
          <g stroke="currentColor" stroke-width="4.5">
            <!-- G -->
            <path d="M246,18 A11,11 0 1,0 246,36 H235 V27 H244" />
            <!-- H -->
            <path d="M258,15 V42 M258,28 H276 M276,15 V42" />
            <!-- T -->
            <path d="M288,15 H306 M297,15 V42" />
            <!-- S -->
            <path d="M324,20 C324,15 312,15 312,23 C312,31 324,30 324,36 C324,42 312,42 312,37" />
          </g>
        </g>
      </svg>
    </div>

    <div class="preview-box light">
      <h3>Light Background (Header)</h3>
      <svg class="logo-wordmark-svg" viewBox="0 0 340 50" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- PRIZM -->
        <g stroke="currentColor" stroke-width="4.5">
          <!-- P -->
          <path d="M12,5 V45 M12,5 L34,17 L12,27" />
          <!-- R -->
          <path d="M46,5 V45 M46,5 L68,17 L46,27 M56,27 L68,45" />
          <!-- I -->
          <path d="M80,5 V45" />
          <!-- M -->
          <path d="M130,45 V5 L146,24 L162,5 V45" />
        </g>
        
        <!-- Z (Gold) -->
        <path d="M92,5 H116 L92,45 H116" stroke="#FFC107" stroke-width="4.5" />
        
        <!-- LIGHTS -->
        <g>
          <!-- L (Gold with underline) -->
          <path d="M178,5 V42 H222" stroke="#FFC107" stroke-width="4.5" />
          <!-- i (White with dot) -->
          <path d="M192,18 V42" stroke="currentColor" stroke-width="4.5" />
          <rect x="189.75" y="6" width="4.5" height="4.5" fill="currentColor" />
          <!-- G, H, T, S (White) -->
          <g stroke="currentColor" stroke-width="4.5">
            <!-- G -->
            <path d="M246,18 A11,11 0 1,0 246,36 H235 V27 H244" />
            <!-- H -->
            <path d="M258,15 V42 M258,28 H276 M276,15 V42" />
            <!-- T -->
            <path d="M288,15 H306 M297,15 V42" />
            <!-- S -->
            <path d="M324,20 C324,15 312,15 312,23 C312,31 324,30 324,36 C324,42 312,42 312,37" />
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
